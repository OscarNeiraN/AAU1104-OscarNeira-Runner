# Template Blue-Green. El workflow reemplaza ${APP_NAME}, ${SLOT} e ${IMAGE}
# antes de aplicar el manifiesto en K3s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}-${SLOT}
  labels:
    app: ${APP_NAME}
    version: ${SLOT}
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ${APP_NAME}
      version: ${SLOT}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
        version: ${SLOT}
    spec:
      containers:
        - name: api
          image: ${IMAGE}
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: production
            - name: DEPLOYMENT_SLOT
              value: ${SLOT}
            - name: DEPLOYMENT_VERSION
              value: ${SLOT}
            - name: DEPLOYED_IMAGE
              value: ${IMAGE}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

